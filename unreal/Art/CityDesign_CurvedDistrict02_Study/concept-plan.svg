<text x='91' y='606' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='16' fill='#b15347'>约5–7m</text>
<text x='295' y='659' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='17' fill='#547b67'>入口庭院</text>
<text x='102' y='391' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='16' fill='#667e8b'>体量间约8m留白</text>
