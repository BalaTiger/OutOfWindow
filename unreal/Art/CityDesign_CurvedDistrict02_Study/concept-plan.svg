<text x='407' y='980' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='17' fill='#965b64'>固定相机 (26,42,37)</text>
<line x1='104' y1='850' x2='204' y2='850' stroke='#304f5f' stroke-width='3' />
<line x1='104' y1='844' x2='104' y2='856' stroke='#304f5f' stroke-width='2' />
<line x1='204' y1='844' x2='204' y2='856' stroke='#304f5f' stroke-width='2' />
<text x='132' y='877' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='16' fill='#243d4e'>20m</text>
<text x='94' y='917' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='17' fill='#667e8b'>包络是设计范围，不是地籍红线。</text>
<text x='94' y='943' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='15' fill='#667e8b'>虚线视线只提示风险，须由模型实渲复核。</text>
<text x='787' y='195' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='24' fill='#243d4e'>一组可见商圈街区</text>
<text x='787' y='236' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>A：近端低，入口抬起，远端收角。</text>
<text x='787' y='272' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>B：主力商业楼板，局部中庭与退台。</text>
<text x='787' y='308' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>C：后端较高，第一轮仅轮廓占位。</text>
<text x='787' y='344' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>22 / 28 / 36m 均为基底以上最高点。</text>
<text x='787' y='379' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='17' fill='#667e8b'>原案例规模不缩小照搬，三座不是圆柱复制。</text>
<text x='787' y='476' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='24' fill='#243d4e'>连续性来自空间与曲率</text>
<text x='787' y='517' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>桥与楼层相切，入口/围带/退台共同组织。</text>
<text x='787' y='553' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>桥宽5–6m；初始桥下净空约8m。</text>
<text x='787' y='589' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>实际桥跨可能12–18m，落点仍需设计。</text>
<text x='787' y='624' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='18' fill='#243d4e'>少数主围带；玻璃、百叶、实体面有分区。</text>
<text x='787' y='714' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='24' fill='#243d4e'>下一最小样板</text>
<text x='787' y='755' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>A+B完整外部、一个桥、一个入口庭院。</text>
<text x='787' y='791' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='19' fill='#243d4e'>B07：3层转角幕墙试片，约9×10.8m。</text>
<text x='787' y='826' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='18' fill='#243d4e'>固定窗景＋桥下街景＋侧光幕墙真实CPU图。</text>
<text x='787' y='862' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='18' fill='#243d4e'>评价厚度、反射和空隙，不用面数代替成品。</text>
<text x='787' y='898' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='17' fill='#667e8b'>旧Mall01保留；本轮无新模型/UE/GPU。</text>
<text x='65' y='1022' font-family='Microsoft YaHei,Segoe UI,sans-serif' font-size='15' fill='#667e8b'>参考：Galaxy SOHO / ZHA；Westfield Mall of the Netherlands / MVSA。详见proposal-zh.md与原图来源。</text>
</svg>
